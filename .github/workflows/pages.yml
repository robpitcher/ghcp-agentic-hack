name: Build and deploy public workshop site

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build and deploy
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: public-pages-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate
      - name: Build public site
        run: pnpm build
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
          WORKSHOP_ENVIRONMENT: production
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed routes
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.deployment.outputs.page_url }}"
          base="${base%/}/"
          curl --fail --retry 5 --retry-delay 5 "${base}site-routes.json" --output site-routes.json
          jq -r '.routes[]' site-routes.json | while IFS= read -r route; do
            curl --fail --retry 5 --retry-delay 5 "${base}${route}" > /dev/null
          done
